<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mocap — box tracker to being Curve</title>
  <meta name="description" content="Track a marker in a video and export a being-compatible spline. Runs in the browser; clips stay on your machine." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <h1>Mocap</h1>
        <p class="tagline">Box tracker → being Curve</p>
      </div>
      <a class="top-link" href="https://github.com/porsandraostudio/Mocap">GitHub</a>
    </header>

    <section class="source-bar">
      <h2>Source</h2>
      <div class="row">
        <label class="btn">
          Upload
          <input type="file" id="fileInput" accept="video/*" hidden />
        </label>
        <button type="button" class="btn ghost" id="camBtn">Camera</button>
      </div>
      <p class="hint" id="sourceHint">Upload, drop a video on Preview, or record with the camera.</p>
      <div class="top-meta" id="clipMeta">No clip loaded</div>
    </section>

    <main class="stage">
      <section class="bundle">
        <div class="bundle-head">
          <h2>Preview</h2>
        </div>  
        <div class="video-frame" id="videoFrame">
          <video id="video" playsinline muted></video>
          <canvas id="overlay"></canvas>
          <div class="empty" id="emptyState">
            Drop a video here, or use Upload / Camera, then draw a box around the thing you want to follow.
          </div>
        </div>
        <div class="transport">
          <button type="button" class="icon-btn" id="playBtn" title="Play / pause">Play</button>
          <input type="range" id="seek" min="0" max="0" step="0.001" value="0" />
          <span class="time" id="timeLabel">0 / 0</span>
        </div>
        <div class="track-tools">
          <div class="row">
            <label class="field grow">
              Axis
              <select id="axis">
                <option value="y">Y</option>
                <option value="x">X</option>
                <option value="xy">X + Y</option>
              </select>
            </label>
            <label class="field grow">
              FPS
              <input type="number" id="fps" value="30" min="1" max="240" step="0.01" />
            </label>
          </div>
          <div class="row">
            <button type="button" class="btn" id="drawBtn">Draw box</button>
            <button type="button" class="btn primary" id="trackBtn">Track</button>
          </div>
          <div class="progress hidden" id="progressWrap">
            <div class="bar" id="progressBar"></div>
            <span id="progressText">Tracking…</span>
          </div>
        </div>
      </section>

      <section class="bundle">
        <div class="curve-head">
          <h2>Export</h2>
          <span class="hint" id="fitHint">Track or load JSON. Black dots are knots.</span>
        </div>
        <canvas id="plot"></canvas>
        <div class="export-tools">
          <label class="check"><input type="checkbox" id="invert" checked /> Invert axis (image Y is down)</label>
          <label class="field">
            Smoothing <span id="smoothLabel">0</span>
            <input type="range" id="smoothing" min="0" max="500" step="1" value="0" />
          </label>
          <div class="row">
            <button type="button" class="btn" id="csvBtn" disabled>CSV</button>
            <button type="button" class="btn primary" id="jsonBtn" disabled>JSON</button>
            <label class="btn ghost">
              Load JSON
              <input type="file" id="jsonInput" accept="application/json,.json" hidden />
            </label>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="spline.js"></script>
  <script src="tracking.js"></script>
  <script src="app.js"></script>
</body>
</html>
